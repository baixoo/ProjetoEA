services:
  postgres:
    image: postgres:18.3
    container_name: postgresdb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - notub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - notub
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build: ./backend/notub
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      
      FRONTEND_URL: ${FRONTEND_URL}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_FILA: ${RABBITMQ_FILA}
      RABBITMQ_RK_UTILIZADOR_CRIADO: ${RABBITMQ_RK_UTILIZADOR_CRIADO}
      RABBITMQ_RK_RECUPERACAO_PASSWORD: ${RABBITMQ_RK_RECUPERACAO_PASSWORD}
      
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    networks:
      - notub

  servico-email:
    build: ./servico-email
    deploy:
      replicas: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./servico-email/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
    networks:
      - notub

  frontend:
    build: ./frontend
    deploy:
      replicas: 1
    networks:
      - notub

  nginx:
    image: nginx:stable
    container_name: nginx
    entrypoint: ["/bin/sh", "-c"]
    command: ["sh /docker-entrypoint.d/99-certs.sh && /docker-entrypoint.sh nginx -g 'daemon off;'"]
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/generate-certs.sh:/docker-entrypoint.d/99-certs.sh
    depends_on:
      - frontend
      - backend
    networks:
      - notub

volumes:
  pgdata: