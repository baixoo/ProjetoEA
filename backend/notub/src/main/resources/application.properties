spring.application.name=notub

# Trust forwarded headers from nginx (required for OAuth2 redirect URI behind reverse proxy)
server.forward-headers-strategy=NATIVE

# PostgreSQL configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
# 86400000ms = 24 hours
projetoea.app.jwtSecret=${JWT_SECRET}
projetoea.app.jwtExpirationMs=86400000

# Google OAuth2 Client Config
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:default}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:default}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
