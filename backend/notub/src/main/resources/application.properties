spring.application.name=notub

server.forward-headers-strategy=NATIVE

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

projetoea.app.jwtSecret=${JWT_SECRET}
projetoea.app.jwtExpirationMs=86400000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:default}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:default}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:notub}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:notub123}

notub.rabbitmq.exchange=${RABBITMQ_EXCHANGE:notub.email.exchange}
notub.rabbitmq.fila=${RABBITMQ_FILA:notub.email.fila}
notub.rabbitmq.routing-key.utilizador-criado=${RABBITMQ_RK_UTILIZADOR_CRIADO:UTILIZADOR_CRIADO}
notub.rabbitmq.routing-key.recuperacao-password=${RABBITMQ_RK_RECUPERACAO_PASSWORD:RECUPERACAO_PASSWORD_PEDIDA}

notub.stripe.secret-key=${STRIPE_SECRET_KEY}
notub.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}