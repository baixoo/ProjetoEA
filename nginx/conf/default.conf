events {
    worker_connections 2048;
}

worker_processes auto;

http {
  server_tokens off;

  open_file_cache max=1000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  upstream backend {
    server backend:8080;
  }

  upstream frontend {
    server frontend:80;
  }

  server {
    #listen 443 ssl;
    listen 80;
    listen [::]:80;
    server_name notub.bounceme.net www.notub.bounceme.net;
    # SPA
    location / {
      proxy_pass http://frontend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /sw.js {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.json {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=604800" always;
    }

    # API
    location /api/ {
      proxy_pass http://backend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # OAuth2 - only proxy the authorization initiation to backend
    # /oauth2/authorization/google -> backend (starts OAuth flow)
    # /oauth2/redirect -> falls through to SPA (frontend handles token)
    location /oauth2/authorization/ {
      proxy_pass http://backend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /login/oauth2/ {
      proxy_pass http://backend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
