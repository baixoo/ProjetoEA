services:
  postgres:
    image: postgres:18.3
    container_name: postgresdb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - notub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - notub
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend/notub
      target: dev
    container_name: notub-backend-dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: ./mvnw spring-boot:run
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DOCKER_COMPOSE_ENABLED: false

      JWT_SECRET: ${JWT_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      FRONTEND_URL: ${FRONTEND_URL}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_FILA: ${RABBITMQ_FILA}
      RABBITMQ_RK_UTILIZADOR_CRIADO: ${RABBITMQ_RK_UTILIZADOR_CRIADO}
      RABBITMQ_RK_RECUPERACAO_PASSWORD: ${RABBITMQ_RK_RECUPERACAO_PASSWORD}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    networks:
      - notub
    develop:
      watch:
        - action: sync+restart
          path: ./backend/notub/src
          target: /app/src
        - action: rebuild
          path: ./backend/notub/pom.xml
        - action: rebuild
          path: ./backend/notub/Dockerfile

  servico-email:
    build: ./servico-email
    container_name: notub-email-dev
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./servico-email/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      FRONTEND_URL: ${FRONTEND_URL}
    networks:
      - notub

  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    container_name: caddy
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - backend
    networks:
      - notub
    develop:
      watch:
        - action: rebuild
          path: ./caddy/Caddyfile
        - action: rebuild
          path: ./frontend/NoTUB_Frontend/package.json
        - action: rebuild
          path: ./frontend/NoTUB_Frontend/package-lock.json
        - action: rebuild
          path: ./frontend/NoTUB_Frontend/src

volumes:
  pgdata:
  caddy_data:

networks:
  notub:
    driver: bridge
